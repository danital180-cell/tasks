<!doctype html>
<html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>משימות – העוזר האישי</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#2f5bd3"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="משימות">
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--mute:#6b7075;--line:#e4e2dc;--ok:#1a7f4b;--warn:#b8860b;--bad:#b3261e;--acc:#2f5bd3}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line);z-index:2}
  h1{font-size:20px;margin:0 0 6px} .stats{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
  .syncmsg{font-size:12px;font-weight:400;color:var(--mute);margin-inline-start:6px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
  main{padding:8px 16px 90px;max-width:720px;margin:0 auto}
  h2{font-size:15px;color:var(--mute)}
  .t{--ac:#6b7075;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--ac);border-radius:12px;padding:9px 12px;margin:7px 0}
  .ctm{flex:none;min-width:46px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);font-size:15px}
  .ctm.no{color:var(--line);font-weight:400}
  .chev{flex:none;border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:4px 6px;cursor:pointer;transition:transform .15s}
  .t.open .chev{transform:rotate(180deg)}
  .cs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:5px 0 0;margin-inline-start:34px;font-size:12.5px;color:var(--mute);cursor:pointer}
  .chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--ac) 18%,transparent)}
  .cs .lk{margin-inline-start:auto;display:flex;gap:6px}
  .cs .btn{padding:2px 9px}
  .np{margin:3px 0 0;margin-inline-start:34px;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more{display:none;margin-top:4px}
  .t.open .more{display:block}.t.open .np{display:none}
  .pill[data-f]{cursor:pointer}.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
  h2{position:sticky;top:var(--hh,96px);z-index:1;background:var(--bg);padding:6px 0;margin:10px 0 2px}
  .t.done .ttl{text-decoration:line-through;color:var(--mute)}
  .row{display:flex;align-items:center;gap:10px}
  .row input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ok)}
  .ttl{flex:1;font-weight:600;border-radius:6px;padding:2px 4px;outline:none}
  .ttl:focus{background:var(--bg);box-shadow:0 0 0 2px var(--acc)}
  .meta{font-size:12.5px;color:var(--mute);margin:4px 34px 0 0}
  .stuck{color:var(--bad);font-weight:600}
  .t.late{border-color:var(--bad);border-inline-start:4px solid var(--bad)}.t.late .ctm{color:var(--bad)}
  .t.late .ttl{color:var(--bad)}
  .late-tag{color:var(--bad);font-weight:700}
  .ctl{display:flex;gap:6px;margin:8px 34px 0 0;flex-wrap:wrap}
  select,textarea,input[type=text],input[type=date],input[type=time]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
  textarea{width:100%;min-height:84px;margin:6px 0 0;resize:vertical;line-height:1.45}
  .btn{display:inline-block;text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--ink);background:#fff}
  .saved{font-size:12px;color:var(--ok);margin-inline-start:6px}
  .add{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap} .add #newTitle{flex:1 1 100%}
  .when{display:flex;gap:6px;align-items:center;margin:8px 34px 0 0;font-size:13px;color:var(--mute)}
  .when input{padding:5px 6px}
  .tools{display:flex;gap:6px;margin:4px 0 8px}.tools #q{flex:1;min-width:0}
  #printPanel{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}
  #printPanel.show{display:block}#printPanel .pr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  #printArea{display:none}
  @media print{
    body{background:#fff;color:#000;font-size:13pt}
    header,main,.toast{display:none!important}
    #printArea{display:block!important;direction:rtl;padding:0}
    #printArea h1{font-size:18pt;margin:0 0 4pt}#printArea .sub{color:#444;font-size:11pt;margin-bottom:10pt}
    #printArea h2{position:static;background:none;font-size:13pt;margin:12pt 0 4pt;padding-bottom:2pt;border-bottom:1px solid #000;color:#000}
    #printArea .pi{display:flex;gap:8pt;padding:4pt 0;border-bottom:1px dotted #bbb;page-break-inside:avoid}
    #printArea .bx{flex:none;width:11pt;height:11pt;border:1.5px solid #000;margin-top:3pt}
    #printArea .bx.dn{background:#000}
    #printArea .tm{flex:none;min-width:38pt;font-weight:700}
    #printArea .mt{color:#444;font-size:10.5pt}
    #printArea .ti.dn{text-decoration:line-through;color:#555}
  }
  .closedbox{margin:22px 0 8px;border-top:1px dashed var(--line);padding-top:10px}
  .closedbox summary{cursor:pointer;color:var(--mute);font-size:14px;font-weight:600;padding:6px 0;list-style:none}
  .closedbox summary::-webkit-details-marker{display:none}
  .t.cancelled .ttl{text-decoration:line-through;color:var(--mute)}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1f2328;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;display:none;gap:14px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9;max-width:calc(100% - 32px)}
  .toast.show{display:flex}
  .toast button{background:none;border:0;color:#8fb0ff;font:inherit;font-weight:700;cursor:pointer;padding:0}
  @media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--mute:#9aa0a6;--line:#30343a}select,textarea,input[type=text],input[type=date],input[type=time],.btn{background:#26292e;color-scheme:dark}}
</style></head><body>
<header><h1>סגירת שבוע – משימות <span id="sync" class="syncmsg"></span></h1><div class="stats" id="stats">טוען…</div></header>
<main>
  <div class="add"><input type="text" id="newTitle" placeholder="משימה חדשה…"><select id="newArea"></select><input type="date" id="newDate" title="תאריך (לא חובה)"><input type="time" id="newTime" title="שעה (לא חובה)"><button class="btn" onclick="addNew()">+ הוסף משימה</button></div>
  <div class="tools"><input type="text" id="q" placeholder="🔍 חיפוש משימה…" oninput="QUERY=this.value.trim();render()"><button class="btn" id="viewBtn" onclick="toggleView()"></button><button class="btn" onclick="togglePrint()">🖨 הדפסה</button></div>
  <div id="printPanel"><b>דוח משימות להדפסה</b><div class="pr">מתאריך <input type="date" id="pFrom"> עד <input type="date" id="pTo"></div><div class="pr"><label><input type="checkbox" id="pLate" checked> כולל באיחור ובלי תאריך</label><label><input type="checkbox" id="pDone"> כולל בוצעו</label></div><div class="pr"><button class="btn" onclick="doPrint()">🖨 הדפס / שמור PDF</button><button class="btn" onclick="togglePrint()">סגור</button></div></div>
  <div id="list"></div>
</main>
<div id="printArea"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">ביטול</button></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycby8A_4S3TNPXf2k9KaPTbtNFkhbkFxRSf9DvXDZD2XwkDgrlHAqqiUg5DziixBNEa9t4Q/exec';
function getKey(){const m=location.hash.match(/k=([A-Za-z0-9]+)/);if(m){try{localStorage.setItem('tasksKey',m[1])}catch(e){}return m[1]}try{return localStorage.getItem('tasksKey')||''}catch(e){return''}}
const KEY = getKey();
function call(params,tries){tries=tries==null?(params&&params.a==='list'?3:1):tries;const q=new URLSearchParams(Object.assign({p:'api',k:KEY},params));
  return fetch(API+'?'+q.toString()).then(r=>r.json()).then(j=>{if(j&&j.error)throw new Error(j.error);return j})
    .catch(e=>{if(tries>1&&!/unauthor|key|מפתח/i.test(e.message))return new Promise(r=>setTimeout(r,700)).then(()=>call(params,tries-1));throw e})}
const ST = {open:'פתוח',progress:'בתהליך',done:'בוצע',postponed:'נדחה',cancelled:'בוטל'};
let FILTER = '', EXP = {}, DATA = [], AREAS = [], CLOSED_OPEN = false, toastTimer = null, QUERY = '', VIEW = 'day';
try{VIEW=localStorage.getItem('tasksView')||'day'}catch(e){}
function toggleView(){VIEW=VIEW==='day'?'area':'day';try{localStorage.setItem('tasksView',VIEW)}catch(e){}render()}
function hit(t){if(!QUERY)return true;return [t.title,t.contact,t.owner,t.area,t.note].join(' ').toLowerCase().indexOf(QUERY.toLowerCase())>=0}
function dayLabel(d){if(!d)return'ללא תאריך';const today=new Date().toLocaleDateString('sv-SE'),tm=new Date(Date.now()+864e5).toLocaleDateString('sv-SE');const nm=new Date(d+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'});return d<today?'⚠ באיחור · '+nm:d===today?'היום · '+nm:d===tm?'מחר · '+nm:nm}
function togglePrint(){const p=document.getElementById('printPanel');p.classList.toggle('show');if(p.classList.contains('show')&&!document.getElementById('pFrom').value){const n=new Date(),dow=n.getDay(),e=new Date(n.getTime()+(6-dow)*864e5);document.getElementById('pFrom').value=n.toLocaleDateString('sv-SE');document.getElementById('pTo').value=e.toLocaleDateString('sv-SE')}}
function pLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'})}
function doPrint(){
  const from=document.getElementById('pFrom').value,to=document.getElementById('pTo').value,late=document.getElementById('pLate').checked,dn=document.getElementById('pDone').checked;
  if(!from||!to||from>to){notify('בחר טווח תאריכים תקין');return}
  const day=t=>String(t.due||'').slice(0,10),isCl=t=>t.status==='done'||t.status==='cancelled';
  const keep=t=>t.status!=='cancelled'&&(dn||t.status!=='done');
  const cmp=(a,b)=>(day(a)||'9999').localeCompare(day(b)||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99');
  const L=DATA.filter(keep).sort(cmp);
  const inR=L.filter(t=>day(t)>=from&&day(t)<=to);
  const over=late?L.filter(t=>day(t)&&day(t)<from&&!isCl(t)):[];
  const none=late?L.filter(t=>!day(t)&&!isCl(t)):[];
  const row=t=>{const m=[];if(t.area&&t.area!=='אחר')m.push(esc(t.area));if(t.contact)m.push('👤 '+esc(t.contact));if(t.owner)m.push('⏳ '+esc(t.owner));if(t.note)m.push(esc(t.note));
    return '<div class="pi"><span class="bx'+(t.status==='done'?' dn':'')+'"></span><span class="tm">'+esc(t.time||'')+'</span><span><span class="ti'+(t.status==='done'?' dn':'')+'">'+esc(t.title)+'</span>'+(m.length?'<div class="mt">'+m.join(' · ')+'</div>':'')+'</span></div>'};
  let h='<h1>משימות · '+fmt(from)+' – '+fmt(to)+'</h1><div class="sub">הודפס: '+new Date().toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+' · '+(inR.length+over.length+none.length)+' משימות</div>';
  if(over.length)h+='<h2>⚠ באיחור</h2>'+over.map(t=>{const r=row(t);return r.replace('<span class="tm">'+esc(t.time||'')+'</span>','<span class="tm">'+fmt(t.due)+'</span>')}).join('');
  const g={};inR.forEach(t=>(g[day(t)]=g[day(t)]||[]).push(t));
  Object.keys(g).sort().forEach(d=>{h+='<h2>'+esc(pLabel(d))+'</h2>'+g[d].map(row).join('')});
  if(none.length)h+='<h2>ללא תאריך</h2>'+none.map(row).join('');
  if(!inR.length&&!over.length&&!none.length)h+='<p>אין משימות בטווח שנבחר.</p>';
  document.getElementById('printArea').innerHTML=h;
  setTimeout(()=>window.print(),50);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(d){if(!d)return'';const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}
function tel(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='972'+d.slice(1);return d}
// פתיחה מהירה: מציגים מיד את הרשימה האחרונה ששמורה בטלפון, ומרעננים מהשרת ברקע
function setSync(t){const el=document.getElementById('sync');if(el)el.textContent=t||''}
function load(){if(!KEY){document.getElementById('stats').textContent='חסר מפתח – פתח את הקישור מהבוט פעם אחת.';return}
  if(!DATA.length){try{const c=JSON.parse(localStorage.getItem('tasksCache')||'null');if(c&&c.items){DATA=c.items;AREAS=c.areas;render()}}catch(e){}}
  setSync('⟳ מתעדכן…');
  call({a:'list'}).then(r=>{DATA=r.items;AREAS=r.areas;const a=document.activeElement;
    if(a&&(/INPUT|TEXTAREA|SELECT/.test(a.tagName)||a.isContentEditable))a.addEventListener('blur',()=>setTimeout(render,50),{once:true});else render();setSync('');try{localStorage.setItem('tasksCache',JSON.stringify({items:r.items,areas:r.areas}))}catch(e){}})
  .catch(e=>{setSync('⚠ אין חיבור – מוצגת הרשימה האחרונה');if(!DATA.length)document.getElementById('stats').textContent='שגיאה: '+e.message})}
function render(){
  const c={done:0,progress:0,open:0,postponed:0,cancelled:0};DATA.forEach(t=>c[t.status]=(c[t.status]||0)+1);
  const nLate=DATA.filter(isLate).length;
  const pl=(f,txt,extra)=>'<span class="pill'+(extra?' '+extra:'')+(f&&FILTER===f?' on':'')+'" data-f="'+f+'" onclick="setFilter(\''+f+'\')">'+txt+'</span>';
  const pills=[pl('','סה"כ '+DATA.length),pl('open','⬜ '+c.open+' פתוחות'),pl('progress','🔄 '+c.progress+' בתהליך')];
  if(c.postponed)pills.push(pl('postponed','⏭ '+c.postponed+' נדחו'));
  if(nLate)pills.push(pl('late','⚠ '+nLate+' באיחור','late-tag'));
  pills.push(pl('done','✅ '+c.done+' בוצעו'),pl('cancelled','❌ '+(c.cancelled||0)+' בוטלו'));
  document.getElementById('stats').innerHTML=pills.join('');
  document.getElementById('newArea').innerHTML=AREAS.map(a=>'<option>'+esc(a)+'</option>').join('');
  // סדר: פתוחות לפני סגורות, ואז לפי תאריך יעד (בלי תאריך – בסוף), ואז לפי מועד יצירה
  const closed=t=>t.status==='done'||t.status==='cancelled'?1:0;
  const dkey=t=>(String(t.due||'').slice(0,10)||'9999')+' '+(t.time||'99:99');
  DATA.sort((a,b)=>closed(a)-closed(b)||dkey(a).localeCompare(dkey(b))||String(a.created||'').localeCompare(String(b.created||'')));
  const isClosed=t=>t.status==='done'||t.status==='cancelled';
  const CF=FILTER==='done'||FILTER==='cancelled';
  let active=DATA.filter(t=>!isClosed(t)&&hit(t)), done=DATA.filter(t=>isClosed(t)&&hit(t));
  if(FILTER==='late')active=active.filter(isLate);
  else if(FILTER==='open'||FILTER==='progress'||FILTER==='postponed')active=active.filter(t=>t.status===FILTER);
  else if(CF){active=[];done=done.filter(t=>t.status===FILTER);CLOSED_OPEN=true}
  document.getElementById('viewBtn').textContent=VIEW==='day'?'📅 לפי יום':'🗂 לפי תחום';
  const waiting=active.filter(t=>t.owner);
  const mine=active.filter(t=>!t.owner);
  let h='';
  if(VIEW==='day'){
    const groups={};active.forEach(t=>{const d=String(t.due||'').slice(0,10);const k=d||'none';(groups[k]=groups[k]||[]).push(t)});
    const todayS=new Date().toLocaleDateString('sv-SE');const rank=k=>k==='none'?1:(k<todayS?2:0);Object.keys(groups).sort((a,b)=>rank(a)-rank(b)||(rank(a)===2?b.localeCompare(a):a.localeCompare(b))).forEach(k=>{h+='<h2>'+esc(dayLabel(k==='none'?'':k))+'</h2>'+groups[k].map(card).join('')});
  }else{
    AREAS.forEach(a=>{const g=mine.filter(t=>(t.area||'אחר')===a);if(g.length)h+='<h2>'+esc(a)+'</h2>'+g.map(card).join('')});
    if(waiting.length)h+='<h2>⏳ מחכה לאחרים</h2>'+waiting.map(card).join('');
  }
  if(!h&&!(CF&&done.length))h=QUERY?'<p>לא נמצאו משימות עבור "'+esc(QUERY)+'"</p>':'<p>אין משימות פתוחות 🙂</p>';
  if(done.length)h+='<details class="closedbox" id="closedbox"'+(CLOSED_OPEN?' open':'')+' ontoggle="CLOSED_OPEN=this.open"><summary>✅ בוצעו / בוטלו השבוע ('+done.length+') – להצגה ושחזור</summary>'+done.map(card).join('')+'</details>';
  document.getElementById('list').innerHTML=h;
  document.querySelectorAll('#list textarea').forEach(grow);
  fixHH();
}
function setFilter(f){FILTER=FILTER===f?'':f;render()}
function fixHH(){const h=document.querySelector('header');if(h)document.documentElement.style.setProperty('--hh',(h.offsetHeight-1)+'px')}
window.addEventListener('resize',fixHH);
// באיחור: משימה פתוחה שהתאריך (והשעה, אם יש) כבר עברו
function isLate(t){if(!t.due||t.status==='done'||t.status==='cancelled')return false;const d=String(t.due).slice(0,10);
  const now=new Date(),today=now.toLocaleDateString('sv-SE');if(d<today)return true;if(d>today)return false;
  if(!t.time)return false;return t.time<now.toTimeString().slice(0,5)}
const AC={'הרצל בוטיק':'#2f5bd3','פסגות העמק':'#1a7f4b','סכנין':'#d9480f','טאבונוצי':'#c28a00','RETAIN':'#7c3aed','אישי':'#d6336c','אחר':'#8a8f94'};
function areaColor(a){a=a||'אחר';if(AC[a])return AC[a];let h=0;for(const ch of a)h=(h*31+ch.charCodeAt(0))%360;return 'hsl('+h+',55%,42%)'}
function tog(id){const el=document.getElementById('t_'+id);if(!el)return;el.classList.toggle('open');EXP[id]=el.classList.contains('open');if(EXP[id]){const ta=el.querySelector('textarea');if(ta)grow(ta)}}
function card(t){
  const opts=Object.keys(ST).map(s=>'<option value="'+s+'"'+(s===t.status?' selected':'')+'>'+ST[s]+'</option>').join('');
  const m=[];
  if(t.owner)m.push('⏳ '+esc(t.owner));
  if(t.contact)m.push('👤 '+esc(t.contact));
  const late=isLate(t);
  if(late)m.push('<span class="late-tag">⚠ באיחור</span>');
  if(t.weeks>=2&&t.status!=='done')m.push('<span class="stuck">נדחה '+t.weeks+' שבועות</span>');
  const ar=t.area||'אחר';
  let links='';
  if(t.phone){const d=tel(t.phone);links='<span class="lk"><a class="btn" onclick="event.stopPropagation()" href="tel:+'+d+'">📞</a><a class="btn" onclick="event.stopPropagation()" target="_blank" href="https://wa.me/'+d+(t.owner?'?text='+encodeURIComponent('היי, רק מזכיר: '+t.title):'')+'">💬</a></span>'}
  const tmTxt=VIEW==='area'&&t.due?fmt(t.due)+(t.time?' '+esc(t.time):''):esc(t.time||'');
  const tm=tmTxt?'<span class="ctm">'+tmTxt+'</span>':'<span class="ctm no">––</span>';
  const open=EXP[t.id]?' open':'';
  const note=String(t.note||'').trim();
  return '<div class="t '+(t.status==='done'||t.status==='cancelled'?t.status:'')+(late?' late':'')+open+'" style="--ac:'+areaColor(ar)+'" id="t_'+t.id+'"><div class="row"><input type="checkbox" '+(t.status==='done'?'checked':'')+' onchange="setSt(\''+t.id+'\',this.checked?\'done\':\'open\')">'+tm+'<div class="ttl" contenteditable="true" title="לחיצה לעריכת השם" onblur="setTitle(\''+t.id+'\',this.innerText)">'+esc(t.title)+'</div><button class="chev" aria-label="פתח/סגור" onclick="tog(\''+t.id+'\')">▾</button></div>'+
   '<div class="cs" onclick="tog(\''+t.id+'\')"><span class="chip">'+esc(ar)+'</span>'+m.join(' · ')+links+'</div>'+
   (note?'<div class="np" onclick="tog(\''+t.id+'\')">📝 '+esc(note.split('\n')[0])+'</div>':'')+
   '<div class="more">'+
   '<div class="when">📅 <input type="date" id="d_'+t.id+'" value="'+esc(String(t.due||'').slice(0,10))+'" onchange="setWhen(\''+t.id+'\')"> 🕒 <input type="time" id="h_'+t.id+'" value="'+esc(t.time||'')+'" onchange="setWhen(\''+t.id+'\')"></div>'+
   '<div class="ctl"><select onchange="setSt(\''+t.id+'\',this.value)">'+opts+'</select>'+'<select onchange="setArea(\''+t.id+'\',this.value)">'+AREAS.map(a=>'<option'+(a===ar?' selected':'')+'>'+esc(a)+'</option>').join('')+'</select><span class="saved" id="s_'+t.id+'"></span></div>'+
   '<div class="ctl" style="display:block"><textarea placeholder="הערה…" oninput="grow(this)" onchange="setNote(\''+t.id+'\',this.value)">'+esc(t.note)+'</textarea></div></div></div>';
}
function grow(el){el.style.height='auto';el.style.height=Math.max(el.scrollHeight+2,84)+'px'}
function save(id,st,note,area,title){const s=document.getElementById('s_'+id);if(s)s.textContent='שומר…';call({a:'update',id:id,status:st,note:note||'',area:area||'',title:title||''}).then(()=>{const s2=document.getElementById('s_'+id);if(s2)s2.textContent='✓ נשמר'}).catch(e=>{const s2=document.getElementById('s_'+id);if(s2)s2.textContent='שגיאה'})}
function setSt(id,st,noToast){const t=DATA.find(x=>x.id===id);const prev=t.status;if(prev===st)return;t.status=st;save(id,st,t.note);render();
  if(!noToast&&(st==='done'||st==='cancelled'))toast((st==='done'?'✅ סומן כבוצע: ':'❌ בוטל: ')+t.title,()=>setSt(id,prev,true));}
function toast(msg,undo){const el=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg.length>40?msg.slice(0,40)+'…':msg;
  const b=document.getElementById('toastUndo');b.textContent='ביטול';b.onclick=()=>{el.classList.remove('show');clearTimeout(toastTimer);undo()};
  el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),6000)}
function setTitle(id,v){const t=DATA.find(x=>x.id===id);v=String(v||'').replace(/\s+/g,' ').trim();if(!v||v===t.title)return;t.title=v;save(id,t.status,t.note,'',v)}
function setArea(id,a){const t=DATA.find(x=>x.id===id);t.area=a;save(id,t.status,t.note,a);render()}
function setNote(id,v){const t=DATA.find(x=>x.id===id);t.note=v;save(id,t.status,v)}
function setWhen(id){const t=DATA.find(x=>x.id===id);const d=document.getElementById('d_'+id).value,h=document.getElementById('h_'+id).value;if(!d&&!h)return;
  const s=document.getElementById('s_'+id);if(s)s.textContent='מעדכן ביומן…';
  call({a:'when',id:id,date:d,time:h}).then(r=>{t.due=d||new Date().toLocaleDateString('sv-SE');t.time=h;if(r&&r.ref)t.ref=r.ref;render();const s2=document.getElementById('s_'+id);if(s2)s2.textContent=r&&r.error?'נשמר, היומן לא עודכן':'✓ עודכן ביומן'}).catch(e=>{const s2=document.getElementById('s_'+id);if(s2)s2.textContent='שגיאה'})}
let ADDING=false;
function normT(x){return String(x||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()}
function notify(msg){const el=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;const b=document.getElementById('toastUndo');b.textContent='סגור';b.onclick=()=>{el.classList.remove('show');clearTimeout(toastTimer)};el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),6000)}
function addNew(){if(ADDING)return;const i=document.getElementById('newTitle');const v=i.value.trim();if(!v)return;
  const dup=DATA.find(t=>t.status!=='done'&&t.status!=='cancelled'&&normT(t.title)===normT(v));
  if(dup){notify('⚠️ כבר קיימת משימה פתוחה בשם הזה – לא נוספה');return}
  ADDING=true;const a=document.getElementById('newArea').value;const nd=document.getElementById('newDate'),nh=document.getElementById('newTime');call({a:'add',title:v,area:a,date:nd.value,time:nh.value}).then(()=>{i.value='';nd.value='';nh.value='';ADDING=false;load()}).catch(e=>{ADDING=false;document.getElementById('stats').textContent='שגיאה: '+e.message})}
document.getElementById('newTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addNew()}});
load();
// כל דקה: בדיקה מחדש של איחורים (בלי לגעת בשדה שאתה עורך כרגע)
setInterval(()=>{const a=document.activeElement;if(DATA.length&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)||a&&a.isContentEditable))render()},60000);
</script></body></html>
